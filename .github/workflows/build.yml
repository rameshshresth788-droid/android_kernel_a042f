name: A04E KernelSU Next Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev python3 cpio rsync device-tree-compiler

      - name: Compile kernel
        run: |
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: A04E-KernelSU-Next-Image
          path: build/Image.gz
          if-no-files-found: error
