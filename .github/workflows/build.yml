name: Kernel Compilation (stock config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Set up build environment
      run: |
        sudo apt update -y
        sudo apt install -y libncurses5-dev libtinfo5 bc bison flex libssl-dev cpio lz4 xz-utils

    - name: Compile Kernel
      run: |
        bash build_kernel.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: A04E-Kernel-Build
        path: build/*
